[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit"
version = "0.1.0"
description = "Консольный набор утилит: калькулятор и конвертер единиц"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
disallow_untyped_defs = true
